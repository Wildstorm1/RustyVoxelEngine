[package]
name = "rusty_presto"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl3 = { version = "0.18.4", features = [ "build-from-source", "ash" ] }
ash = { version = "0.38.0", features = [ "linked" ] }
image = { version = "0.25.10", features = [ "png", "jpeg" ] }
glm = { version = "0.3.0" }
noise = { version = "0.9.0" }
bevy_ecs = { version = "0.19.0" }

[build-dependencies]
copy_to_output = "2.1.0"